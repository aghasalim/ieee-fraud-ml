name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      # No Kaggle credentials in CI, by design: everything asserted here runs on
      # the synthetic generator, so the suite is reproducible by anyone.
      - run: python -m pytest tests/ -q
